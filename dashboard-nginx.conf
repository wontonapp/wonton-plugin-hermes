map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    client_max_body_size 0;

    # 试点：把 Hermes 的 HTTP API 转出去（Bearer 由这里加），外部用 scripts/dev.sh web 驱动跑批。
    # 试点：跑批容器的日志（只读），给外面取证用。
    location /pilot/ {
        proxy_pass http://pilot-runner:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /hermes-api/ {
        proxy_pass http://127.0.0.1:8642/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer pilot-api-key-0123456789";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9119;
        proxy_set_header Origin http://127.0.0.1:9119;
        # Uvicorn 信任回环代理；不能让客户端转发头把 WebSocket 对端改成非回环地址。
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
