# Wonton 给 Hermes 的插件，由 init 服务放进 Bot 的数据目录（$HERMES_HOME/plugins/wonton），config.yaml 启用。
name: wonton
version: 1.4.0
description: "每轮带上云吞的用法引导：应用的事用应用的工具、身份已带好不用要令牌、调不通如实说；还没选模型时按说话人的语言告诉他去插件网页的 Keys、Models 页设置。App 一次发的几张照片加一句话收齐了再交给它，不当成一轮一轮的碎消息。旁聊（私聊里的 Matrix 话题）一轮结束在主对话里留一行结果，下一轮把旁聊的动态带给主对话。网页控制台里的对话按打开网页的人说话，会话归属照旧。一轮里调了工具时，聊天里的状态消息列出调过的工具和成没成（私聊里带脱敏后的一行预览，多人房间只写类别）。"
provides_locales: [en, zh, zh-hant, ja]
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_approval_request
  - post_approval_response
  - post_gateway_admission
  - pre_llm_call
  - pre_gateway_dispatch
  - post_llm_call
  - on_session_end
  - on_session_reset
